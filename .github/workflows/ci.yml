name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU Torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        # pytest-asyncio is required: backend/tests/test_dataset_processor.py has
        # async tests that otherwise fail with "async def functions are not natively supported".
        run: python -m pip install -r backend/requirements.txt pytest pytest-asyncio httpx ruff

      - name: Lint (ruff, fatal errors only)
        run: python -m ruff check backend --select E9,F63,F7,F82

      - name: Run tests
        run: python -m pytest backend/tests -v
